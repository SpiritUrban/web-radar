name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/generate-download-manifest.mjs"
      - ".github/workflows/pages.yml"
  workflow_call: # rule 14: a release cannot trigger a workflow via GITHUB_TOKEN
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # to delete the artifacts left by a previous attempt

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Rule 14b: a deploy triggered by a tag publishes the site AS OF THE TAG,
      # silently reverting anything merged since. The manifest is unaffected —
      # it reads GITHUB_REF_NAME, not the checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Generate download manifest
        id: manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 60 req/h per IP without it, then 403
        shell: bash
        run: |
          set -o pipefail
          node scripts/generate-download-manifest.mjs 2>&1 | tee manifest.log
      - name: Surface manifest output
        if: failure() && steps.manifest.conclusion == 'failure'
        shell: bash
        run: bash scripts/ci-annotate.sh "Download manifest output" manifest.log

      - name: Report what the manifest resolved to
        shell: bash
        run: |
          version=$(node -p "require('./site/public/download-manifest.json').version")
          assets=$(node -p "require('./site/public/download-manifest.json').assets.length")
          echo "::notice title=Download manifest::ref=${GITHUB_REF_NAME} -> version ${version}, ${assets} assets"

      - name: Build site
        id: build_site
        env:
          GITHUB_PAGES: "true"
        shell: bash
        run: |
          set -o pipefail
          npm run build:site 2>&1 | tee site.log
      - name: Surface site build output
        if: failure() && steps.build_site.conclusion == 'failure'
        shell: bash
        run: bash scripts/ci-annotate.sh "Site build output" site.log

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          # Sets the Pages source to "GitHub Actions" when it is not already.
          # A repository whose source is still "Deploy from a branch" *accepts*
          # an artifact deployment and then fails it: the site 404s and
          # deploy-pages burns its full timeout before saying anything useful.
          enablement: true

      - name: Report the Pages configuration
        shell: bash
        run: |
          echo "::notice title=Pages::base_url=${{ steps.configure.outputs.base_url }}"

      # "Re-run failed jobs" uploads another artifact into the SAME run and
      # keeps the previous attempt's, so deploy-pages stops with "Multiple
      # artifacts named github-pages were unexpectedly found for this workflow
      # run" — and every further re-run makes it worse. Clear ours first.
      - name: Remove page artifacts left by earlier attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          stale=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          if [ -z "$stale" ]; then
            echo "No previous github-pages artifact in this run."
            exit 0
          fi
          for id in $stale; do
            echo "Deleting artifact $id from an earlier attempt."
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Deploying depends on GitHub's OIDC token service, which answers
        # `503 … reset reason: overflow` during platform incidents — seen on
        # v0.4.0, while every build job was green. The action reports that as
        # "Ensure GITHUB_TOKEN has permission id-token: write", which sends you
        # hunting a permissions bug that is not there. So: try, wait, try again.
        continue-on-error: true
        with:
          # Five minutes is plenty for a healthy deploy; the default ten only
          # makes a broken one cost twice as long to discover.
          timeout: 300000

      - name: Wait out a transient platform error
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Pages deploy retry::First attempt failed; retrying once in 60 s."
          sleep 60

      - name: Deploy to Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

      - name: Explain a failed deployment
        if: failure() && steps.deployment_retry.conclusion == 'failure'
        shell: bash
        run: |
          echo "::error title=Pages deploy failed twice::The release itself is unaffected — installers and latest.json live in GitHub Releases, not Pages, so downloads and auto-update keep working. Check https://www.githubstatus.com (Actions/Pages incidents cause a 503 from the OIDC token service) and Settings → Pages (Source must be \"GitHub Actions\"). Then re-run this job — the tag must not be moved. Deployments: https://github.com/${{ github.repository }}/deployments"

      # Section 11 of STAGE2_BRIEF: a deploy can report success while the live
      # URL keeps serving the previous build. That used to be invisible.
      - name: Verify the live site serves this build
        shell: bash
        run: |
          expected=$(node -p "require('./site/public/download-manifest.json').version")
          url="${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}download-manifest.json"
          for attempt in $(seq 1 12); do
            live=$(curl -sS -L "${url}?check=${GITHUB_RUN_ID}-${attempt}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{console.log("")}})' || true)
            if [ "$live" = "$expected" ]; then
              echo "Live site serves ${live} after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Site did not go live::${url} serves \"${live}\" instead of ${expected}. The release itself is fine — only the site is stale. Re-run this job or push any change under site/."
          exit 1
