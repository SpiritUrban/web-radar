[package]
name = "web-radar"
version = "0.1.0"
edition = "2021"
description = "Memory-efficient CLI for extracting inbound domain links from Common Crawl domain-level web graphs"
license = "MIT"
readme = "README.md"
keywords = ["common-crawl", "webgraph", "cli", "domains"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
flate2 = "1"
indicatif = "0.17"
log = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
