# Paths to Common Crawl domain-level web graph files.
# Accepts plain .txt or .txt.gz (gzip is auto-detected by extension).
[paths]
# Adjust paths to where you stored the Common Crawl domain graph files.
# Gzip (.gz) is supported and auto-detected by extension.
vertices = "cc-main-2026-apr-may-jun-domain-vertices.txt/cc-main-2026-apr-may-jun-domain-vertices.txt"
edges = "cc-main-2026-apr-may-jun-domain-edges.txt"
ranks = "cc-main-2026-apr-may-jun-domain-ranks.txt"
results_dir = "results"

# Which rank metric to attach to each source domain.
# Valid values: "pagerank" (default) or "harmonic"
rank_metric = "pagerank"

# Domains to analyze. For each target the tool finds all domains that
# link *to* it and writes results/{reversed-domain}.json
[[targets]]
domain = "example.com"

[[targets]]
domain = "wikipedia.org"
