[package]
name = "web-radar-desktop"
description = "Desktop Common Crawl link intelligence"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "web_radar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "web-radar-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
web-radar-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "net", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
toml.workspace = true

# Desktop-only: updating and relaunching have no meaning on mobile targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
